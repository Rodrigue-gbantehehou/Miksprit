# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    rate_limiter:
        auth_login:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        password_link_request:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        email_verification_request:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        operator_registration_ip:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        operator_registration_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        operator_registration_verify:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        public_checkout:
            policy: sliding_window
            limit: 12
            interval: '5 minutes'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
