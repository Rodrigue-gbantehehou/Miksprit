<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d584b">
    <meta name="description" content="Choisissez votre ticket Wi-Fi.">
    <title>Tickets Wi-Fi</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body data-api-base="">
    <header class="site-header">
      <div class="site-identity">
        <span class="site-mark" aria-hidden="true"></span>
        <strong id="site-name"></strong>
      </div>
      <span class="secure-note">Paiement en ligne</span>
    </header>

    <main id="main" class="layout">
      <section class="plans-panel" aria-labelledby="plans-title">
        <div class="panel-heading">
          <div>
            <p class="section-kicker">OFFRES DISPONIBLES</p>
            <h1 id="plans-title">Choisissez votre ticket</h1>
          </div>
        </div>

        <div id="message" class="message" role="status" aria-live="polite" hidden></div>
        <div id="plans" class="plans-list" aria-busy="true"></div>
        <form id="checkout-form" class="checkout-form" hidden>
          <h3>Coordonnées</h3>
          <label for="checkout-email">Adresse e-mail</label>
          <input id="checkout-email" name="email" type="email" autocomplete="email" maxlength="190" required>
          <div class="customer-name-fields">
            <div><label for="checkout-first-name">Prénom <span>(facultatif)</span></label><input id="checkout-first-name" name="firstName" autocomplete="given-name" maxlength="120"></div>
            <div><label for="checkout-last-name">Nom <span>(facultatif)</span></label><input id="checkout-last-name" name="lastName" autocomplete="family-name" maxlength="120"></div>
          </div>
          <button class="choose-button" type="submit">Continuer vers le paiement</button>
        </form>
        <div id="order-status" class="order-status" role="status" aria-live="polite" hidden></div>
        <p class="terms">En continuant, vous acceptez les conditions du réseau Wi-Fi.</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Propulsé par <strong>Miksprit</strong></span>
      <span>Montants en XOF</span>
    </footer>
  </body>
</html>
